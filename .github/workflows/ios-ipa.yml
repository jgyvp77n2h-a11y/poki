# Only the unsigned IPA, with no tests (those run in ios-app.yml): a fast build for hand testing
# and for releases. The phone's Rust library is cached by its sources, so most builds are app-only.
name: iOS IPA

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Builds the app from the calling run's commit with a given version (the steps are in .github/actions/build-ipa).
  workflow_call:
    inputs:
      version: { type: string, required: true }
      build: { type: string, required: true }
      # Which connection options to build: external (the one Poki Setup installs) and/or local.
      editions: { type: string, required: false, default: external }

permissions:
  contents: write

concurrency:
  group: ios-ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    # iPhone 14 hand-test build: the standard macOS 26 runner is sufficient and picks up faster.
    # The Duo-specific prealpha flow still uses the Xcode 27 runner and its 27.1 SDK floor.
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Commit ChatModel web_search routing
        shell: bash
        env:
          GIT_AUTHOR_NAME: jgyvp77n2h-a11y
          GIT_AUTHOR_EMAIL: jgyvp77n2h@privaterelay.appleid.com
          GIT_COMMITTER_NAME: jgyvp77n2h-a11y
          GIT_COMMITTER_EMAIL: jgyvp77n2h@privaterelay.appleid.com
        run: |
          set -euo pipefail
          if git apply --check .github/patches/chat-web-search.patch; then
            git apply .github/patches/chat-web-search.patch
            git add native/ios-app/Poki/Chat/ChatModel.swift native/ios-app/Poki/Chat/WebSearch/WebSearch.swift
            git commit -m "fix: route native web_search in ChatModel [skip ci]"
            git push origin HEAD:main
          fi
      - id: build
        uses: ./.github/actions/build-ipa
        with:
          version: ${{ inputs.version }}
          build: ${{ inputs.build }}
          editions: ${{ inputs.editions || 'external' }}
          minimumSDK: 26.0
      - name: Upload build logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Poki-build-logs
          path: build/app-*.log
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        with:
          name: Poki-unsigned
          path: out/
          if-no-files-found: error
      # Only main's caches reach other branches and tags; a branch's own help its next run.
      - if: steps.build.outputs.rust-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cargo/registry
            native/launcher/target
          key: ${{ steps.build.outputs.rust-key }}
      - uses: actions/cache/save@v4
        with:
          path: |
            build/app-external
            build/app-local
            ~/Library/Developer/Xcode/DerivedData/ModuleCache.noindex
          key: ipa-xcode27-${{ github.sha }}
      - name: Publish the unsigned IPA as a release asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create patched-${{ github.run_number }} out/*.ipa out/SHA256SUMS out/Poki-signing.zip --title "patched ${{ github.run_number }}" --notes "Poki built with the backend-awareness patch"
